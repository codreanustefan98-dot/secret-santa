<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Invite links 🎅</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 18px 14px 40px; font-family: "Trebuchet MS", Arial, sans-serif; color: #eaf1ff; background: radial-gradient(circle at 50% 20%, #1c3170, #071028 72%) fixed; }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; text-align: center; font-family: Impact, "Arial Black", sans-serif; font-weight: normal; font-size: clamp(30px, 8vw, 46px); color: #ffd84d; filter: drop-shadow(0 3px 0 #7a1218); }
  .sub { text-align: center; color: #9fb6e8; margin: -6px 0 0; font-size: 14px; }
  .card { background: #fffbe7; color: #1b1b1b; border: 3px solid #333; border-radius: 6px; box-shadow: 5px 6px 0 rgba(0,0,0,.35); padding: 16px; }
  label { display: block; font-weight: bold; margin: 0 0 4px; }
  textarea { width: 100%; min-height: 200px; padding: 10px; font: inherit; font-size: 16px; border: 2px solid #333; border-radius: 8px; }
  .btn { display: inline-block; padding: 8px 12px; border-radius: 12px; cursor: pointer; background: linear-gradient(#4fd17a, #1f8a45); color: #fff; font: inherit; font-weight: 900; font-size: 14px; border: 2px solid #0d4a24; text-decoration: none; }
  .btn.grey { background: linear-gradient(#8e9ab0, #5b667c); border-color: #2b3242; }
  .person { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px dashed #d6c79a; }
  .person:last-child { border-bottom: 0; }
  .person .nm { flex: 1 1 100px; font-weight: bold; font-size: 17px; }
  .tip { font-size: 13px; color: #6b5a3a; }
</style>
</head>
<body>
<main>
  <h1>🎅 INVITE LINKS</h1>
  <p class="sub">Each friend gets their own link, so the game greets them by name. Don't send this page to guests.</p>
  <div class="card">
    <label for="names">Names (one per line)</label>
    <textarea id="names">Ramzi
Ioana
Anca
Stefan
Rares
Vali
Laura
Miruna
Leandro
Adriana
Mihai
Cristina</textarea>
    <p class="tip">The list updates as you type. "WhatsApp" opens a chat with only the link filled in, so you can add your own message.</p>
  </div>
  <div class="card" id="list"></div>
</main>
<script>
/* Must match SANTA_KEY in index.html */
const SANTA_KEY = "mos-craciun-2026";
function encodeToken(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const k = new TextEncoder().encode(SANTA_KEY);
  let s = "";
  bytes.forEach((b, i) => s += String.fromCharCode(b ^ k[i % k.length]));
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const base = location.href.replace(/[^/]*(\?.*)?(#.*)?$/, "");
const linkFor = n => `${base}#t=${encodeToken({ n })}`;
function render() {
  const names = document.getElementById("names").value.split("\n").map(s => s.trim()).filter(Boolean);
  document.getElementById("list").innerHTML = names.map((n, i) => `<div class="person">
    <span class="nm">${esc(n)}</span>
    <a class="btn" href="https://wa.me/?text=${encodeURIComponent(linkFor(n))}" target="_blank" rel="noopener">WhatsApp</a>
    <button class="btn grey" data-i="${i}">Copy</button></div>`).join("");
  document.querySelectorAll("#list [data-i]").forEach(b => b.onclick = async () => {
    try { await navigator.clipboard.writeText(linkFor(names[+b.dataset.i])); b.textContent = "Copied ✓"; }
    catch (e) { b.textContent = "Didn't work"; }
    setTimeout(() => b.textContent = "Copy", 1500);
  });
}
document.getElementById("names").addEventListener("input", render);
render();
</script>
</body>
</html>
