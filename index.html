<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1533">
<title>Merry Christmas! 🎁 Crăciun Fericit!</title>
<style>
  * { box-sizing: border-box; }
  :root { --gold: #ffd84d; --red: #d8323a; --green: #2fa84f; --card: #fffbe7; }
  html, body { margin: 0; min-height: 100%; color-scheme: dark; }
  body {
    font-family: "Trebuchet MS", Arial, sans-serif;
    color: #eaf1ff;
    background: radial-gradient(circle at 50% 28%, #1c3170 0%, #0b1533 50%, #030611 100%) fixed;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  body.lock-scroll { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }

  #snow, #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #snow { z-index: 0; }
  #confetti { z-index: 300; }

  /* ---------- HUB ---------- */
  #hub {
    position: relative; z-index: 1;
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(5vh, env(safe-area-inset-top)) 14px 28px;
    gap: 8px; cursor: crosshair;
  }
  /* Deliberately cheesy PowerPoint-2007 title, Christmas edition */
  #title {
    margin: 0;
    font-family: Impact, "Arial Black", sans-serif; font-weight: normal;
    font-size: clamp(26px, 8.4vw, 92px);
    white-space: nowrap; letter-spacing: 1px;
    background: linear-gradient(#ffffff 8%, #fff0b8 32%, #ffbf2e 58%, #d8323a 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: clamp(1px, .22vw, 2px) #fff;
    filter: drop-shadow(0 3px 0 #7a1218) drop-shadow(0 0 14px rgba(255,216,77,.55));
    animation: titleFloat 2.8s ease-in-out infinite;
  }
  #title span { display: block; text-align: center; }
  #title .t2 { font-size: .78em; margin-top: -.06em; }
  @keyframes titleFloat {
    0%,100% { transform: rotate(-1.5deg) scale(1); }
    50% { transform: rotate(1.5deg) scale(1.03); }
  }
  #subtitle { margin: 0; text-align: center; font-weight: bold; color: #cbdcff; font-size: clamp(14px, 3.8vw, 19px); }

  /* Present */
  .present {
    position: relative; width: clamp(150px, 44vw, 210px); aspect-ratio: 1 / 1;
    margin: 22px 0 0; animation: wobble 3.2s ease-in-out infinite;
  }
  @keyframes wobble {
    0%, 82%, 100% { transform: rotate(0); }
    86% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } 94% { transform: rotate(-2deg); }
  }
  .present .box {
    position: absolute; left: 7%; right: 7%; bottom: 0; height: 66%;
    background: linear-gradient(135deg, #ef4a52, #a3161f);
    border: 4px solid #5e0b12; border-radius: 6px; box-shadow: 0 16px 26px rgba(0,0,0,.5);
  }
  .present .box::before, .present .lid::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 16%;
    transform: translateX(-50%); background: linear-gradient(90deg, #d9a520, #ffe27a, #d9a520);
  }
  .present .lid {
    position: absolute; left: 0; right: 0; top: 18%; height: 20%; z-index: 3;
    background: linear-gradient(135deg, #ff5d65, #b81d27);
    border: 4px solid #5e0b12; border-radius: 6px;
    transition: transform .8s cubic-bezier(.3,1.6,.5,1);
  }
  .bow { position: absolute; left: 50%; bottom: 96%; width: 56%; height: 70%; transform: translateX(-50%); }
  .bow::before, .bow::after {
    content: ""; position: absolute; bottom: 0; width: 50%; height: 100%;
    border: 6px solid var(--gold); border-radius: 50% 50% 12% 50%;
  }
  .bow::before { left: 0; transform: rotate(-18deg); }
  .bow::after { right: 0; border-radius: 50% 50% 50% 12%; transform: rotate(18deg); }
  .padlock { position: absolute; left: 50%; top: 44%; z-index: 4; width: 70%; transform: translateX(-50%); }
  .shackle {
    width: 52%; height: clamp(26px, 8vw, 36px); margin: 0 auto -5px;
    border: 7px solid #c3ccdd; border-bottom: 0; border-radius: 40px 40px 0 0; transition: transform .5s;
  }
  .lock-body {
    background: linear-gradient(#ffe27a, #d9a520); border: 3px solid #7a5a00; border-radius: 10px;
    padding: 8px 2px; text-align: center;
    font: 900 clamp(15px, 4.8vw, 23px) "Courier New", monospace; color: #3a2a00; white-space: nowrap;
  }
  .present.open { animation: none; }
  .present.open .lid { transform: translateY(-85%) rotate(-20deg); }
  .present.open .shackle { transform: translateY(-12px); }
  #presentHint { margin: 4px 0 6px; font-size: 13px; color: #9fb6e8; text-align: center; }

  .stations { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 520px); margin-top: 6px; }
  .station {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 12px 8px; border-radius: 16px; background: rgba(20,35,80,.78);
    border: 2px solid rgba(160,190,255,.25); box-shadow: 0 6px 16px rgba(0,0,0,.3); transition: transform .12s;
  }
  .station:active { transform: scale(.96); }
  .st-ico { font-size: 34px; line-height: 1.1; }
  .st-name { font-weight: bold; font-size: 14px; text-align: center; }
  .st-status { font-size: 12px; color: #9fb6e8; text-align: center; }
  .station.done { border-color: #5fd08a; background: rgba(22,78,52,.72); }
  .station.done .st-status { color: #b9f5cf; }
  .station.locked { opacity: .55; }
  #foot { margin-top: 10px; font-size: 11px; color: #7f95c4; opacity: .8; }

  .burst {
    position: fixed; z-index: 250; pointer-events: none; font-size: 18px; font-weight: bold; color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 12px #6aa9ff; animation: burst .7s ease-out forwards;
  }
  @keyframes burst {
    from { transform: translate(-50%,-50%) scale(.4); opacity: 1; }
    to { transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(1.5); opacity: 0; }
  }
  .floaty {
    position: fixed; z-index: 250; pointer-events: none;
    font: 900 22px "Comic Sans MS", "Trebuchet MS", sans-serif; color: #fff; text-shadow: 0 2px 0 #000;
    animation: floaty .8s ease-out forwards;
  }
  .floaty.bad { color: #ff8080; }
  @keyframes floaty { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(-50%, -140%); opacity: 0; } }

  /* ---------- PANELS ---------- */
  .panel { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column; background: radial-gradient(circle at 50% 18%, #1c3170, #071028 72%); }
  .panel.open { display: flex; animation: panelIn .22s ease-out; }
  @keyframes panelIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .ph { display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); background: rgba(0,0,0,.28); }
  .ph h2 { margin: 0; flex: 1; text-align: center; font-size: clamp(16px, 4.6vw, 22px); }
  .back { padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.13); font-weight: bold; font-size: 15px; }
  .ph-extra { min-width: 64px; text-align: right; font-weight: bold; color: var(--gold); font-size: 16px; }
  .pbody {
    position: relative; flex: 1; overflow: auto;
    padding: 14px 14px max(18px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  .card {
    background: var(--card); color: #1b1b1b; border: 3px solid #333; border-radius: 6px;
    box-shadow: 5px 6px 0 rgba(0,0,0,.35); padding: 16px 18px; width: min(100%, 460px);
    font-size: 16px; line-height: 1.45; text-align: center;
  }
  .card h3 { margin: 0 0 8px; font: 900 23px "Comic Sans MS", "Trebuchet MS", sans-serif; }
  .card p { margin: 6px 0; }
  .card .big-digit {
    display: inline-block; margin: 6px 0; padding: 4px 18px;
    font: 900 54px "Courier New", monospace; color: #3a2a00;
    background: linear-gradient(#ffe27a, #d9a520); border: 3px solid #7a5a00; border-radius: 12px;
  }
  .title-badge {
    display: inline-block; margin: 6px 0; padding: 6px 14px; border-radius: 999px;
    background: #1b1b1b; color: var(--gold); font-weight: 900; font-size: 18px;
  }
  .btn {
    display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 14px;
    background: linear-gradient(#ff6a70, #c4202a); color: #fff; font-weight: 900; font-size: 17px;
    border: 3px solid #5e0b12; box-shadow: 0 4px 0 #5e0b12; text-decoration: none;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5e0b12; }
  .btn.green { background: linear-gradient(#4fd17a, #1f8a45); border-color: #0d4a24; box-shadow: 0 4px 0 #0d4a24; }
  .btn.ghost { background: rgba(0,0,0,.08); color: #333; border-color: #333; box-shadow: 0 3px 0 #333; font-size: 15px; padding: 9px 16px; }
  input.big {
    width: 100%; margin: 8px 0 4px; padding: 10px; font-size: 26px; font-weight: bold; text-align: center;
    border: 3px solid #333; border-radius: 10px; background: #fff; color: #111;
    user-select: text; -webkit-user-select: text;
  }
  .msg { min-height: 22px; font-weight: bold; color: #c4202a; }
  .shake { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); } 80% { transform: translateX(7px); }
  }
  .naughty {
    margin: 10px auto 2px; padding: 10px 14px 12px; max-width: 280px;
    background: #f3e4bf; border: 2px dashed #8a5a2a; border-radius: 4px;
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif; color: #4a2a10; text-align: left; transform: rotate(-1.5deg);
  }
  .naughty b { display: block; text-align: center; font-size: 17px; margin-bottom: 4px; }
  .naughty ol { margin: 0; padding-left: 24px; }
  .naughty li.you { color: #c4202a; font-weight: bold; }
  .lead { margin: 0; text-align: center; color: #cbdcff; max-width: 460px; font-size: 15px; line-height: 1.4; }

  /* ---------- ELVES ---------- */
  .elf-top { text-align: center; }
  .elf-start { font-size: 16px; color: #cbdcff; }
  .elf-start b {
    display: inline-block; margin-left: 6px; padding: 2px 14px;
    font: 900 34px "Courier New", monospace; color: #3a2a00;
    background: linear-gradient(#ffe27a, #d9a520); border: 3px solid #7a5a00; border-radius: 10px;
  }
  .elf-note { font-size: 13px; color: #9fb6e8; margin-top: 6px; }
  .holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: min(100%, 500px); }
  .hole { position: relative; aspect-ratio: 3 / 4; overflow: hidden; }
  .hole::before {
    content: ""; position: absolute; left: 12%; right: 12%; bottom: 13%; height: 13%;
    background: #040a1c; border-radius: 50%; z-index: 1; box-shadow: inset 0 4px 8px rgba(0,0,0,.8);
  }
  .hole::after {
    content: ""; position: absolute; left: -4%; right: -4%; bottom: 0; height: 21%;
    background: radial-gradient(ellipse at 50% 20%, #ffffff, #c9dbff);
    border-radius: 50% 50% 8px 8px; z-index: 3; box-shadow: 0 -2px 0 rgba(255,255,255,.6);
  }
  .elf {
    position: absolute; left: 6%; right: 6%; bottom: 12%; height: 88%; z-index: 2;
    transform: translateY(110%); transition: transform .13s ease-out; cursor: pointer; touch-action: none;
  }
  .elf.up { transform: translateY(0); }
  .elf .esign {
    position: absolute; top: 0; left: -2%; right: -2%; height: 30%; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(#fff, #fffbe7); color: #111; border: 3px solid #333; box-shadow: 3px 4px 0 rgba(0,0,0,.25);
    font: 900 clamp(19px, 6.6vw, 34px) "Comic Sans MS", "Trebuchet MS", sans-serif; transform: rotate(-4deg); white-space: nowrap;
  }
  .elf .esign::before, .elf .esign::after {
    content: ""; position: absolute; bottom: -16%; width: 20%; aspect-ratio: 1;
    background: #f6cfa8; border: 3px solid #7a4a2a; border-radius: 50%;
  }
  .elf .esign::before { left: 8%; }
  .elf .esign::after { right: 8%; }
  .elf svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 74%; transition: transform .1s; transform-origin: 50% 100%; }
  .elf.hit .esign { background: #c9f7c3; }
  .elf.hit svg { transform: scaleY(.78) scaleX(1.08); }
  .elf.miss .esign { background: #ffd6d6; font-size: clamp(15px, 4.8vw, 26px); }

  /* ---------- SNOWY JIGSAW ---------- */
  .snow-hud { display: flex; align-items: center; gap: 10px; width: min(100%, 460px); }
  .bar { flex: 1; height: 16px; border-radius: 10px; background: rgba(255,255,255,.14); overflow: hidden; border: 2px solid rgba(255,255,255,.3); }
  .bar .fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffe27a, #fff); transition: width .2s; }
  #jigScore { font-weight: bold; min-width: 62px; text-align: right; }
  .snow-area {
    position: relative; flex: 1; width: min(100%, 520px); min-height: 380px; overflow: hidden; border-radius: 18px;
    background: linear-gradient(#0d1d48, #1e3c80); border: 2px solid rgba(160,190,255,.25);
  }
  .snow-area::after {
    content: ""; position: absolute; left: -5%; right: -5%; bottom: -30px; height: 70px;
    background: radial-gradient(ellipse at 50% 0, #ffffff, #c9dbff); border-radius: 50% 50% 0 0;
  }
  .flake {
    position: absolute; top: 0; z-index: 5; width: 48px; height: 48px; margin-left: -24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; line-height: 1; color: #fff; text-shadow: 0 0 6px #fff, 0 0 14px #8fc4ff;
    animation: fall linear forwards; touch-action: none;
  }
  .flake.piece { font-size: 32px; filter: drop-shadow(0 0 6px #ffd84d) drop-shadow(0 0 14px #ffb000); }
  .flake.fire { font-size: 30px; filter: drop-shadow(0 0 10px #ff5a00); }
  @keyframes fall {
    from { transform: translate(0, -60px) rotate(0deg); }
    to { transform: translate(var(--sway), var(--fall)) rotate(300deg); }
  }
  .flake.piece { animation-name: fallStraight; }
  @keyframes fallStraight { from { transform: translate(0, -60px); } to { transform: translate(var(--sway), var(--fall)); } }
  .overlay-card { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(4,10,28,.55); }
  .jframe {
    position: relative; width: min(84vw, 340px); aspect-ratio: 1 / 1; flex: none;
    border: 4px solid var(--gold); border-radius: 10px; overflow: hidden;
    background: #071028; box-shadow: 0 0 0 4px #7a5a00, 0 14px 30px rgba(0,0,0,.5);
  }
  .jframe .guide { position: absolute; inset: 0; background-size: 100% 100%; opacity: .14; filter: grayscale(1); }
  .jcell { position: absolute; width: 33.3333%; height: 33.3333%; border: 1px dashed rgba(255,255,255,.25); background-repeat: no-repeat; background-size: 300% 300%; }
  .jcell.filled { border-color: transparent; animation: snap .25s ease-out; }
  .jcell.flash { background-color: rgba(255,80,80,.35); }
  @keyframes snap { from { transform: scale(1.12); } to { transform: scale(1); } }
  .jframe .full { position: absolute; inset: 0; background-size: 100% 100%; opacity: 0; transition: opacity .8s; pointer-events: none; }
  .jframe.solved .full { opacity: 1; }
  .jframe.solved { animation: glow 1.4s ease-in-out 3; }
  @keyframes glow { 50% { box-shadow: 0 0 0 4px #7a5a00, 0 0 40px 10px rgba(255,216,77,.8); } }
  .jtray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: min(100%, 380px); min-height: 70px; }
  .jp {
    width: min(22vw, 84px); aspect-ratio: 1 / 1; border-radius: 6px; border: 2px solid rgba(255,255,255,.5);
    background-repeat: no-repeat; background-size: 300% 300%; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    touch-action: none; cursor: grab; transition: transform .1s;
  }
  .jp.sel { border-color: var(--gold); transform: scale(1.08); box-shadow: 0 0 0 3px var(--gold), 0 6px 14px rgba(0,0,0,.5); }
  .jp.ghost { position: fixed; z-index: 260; pointer-events: none; opacity: .9; transform: translate(-50%, -50%) scale(1.1); }
  .jp.dragging { opacity: .3; }

  /* ---------- GEO ---------- */
  .geo-wrap {
    position: relative; width: min(100%, 640px); height: min(58vh, 520px); flex: none;
    border-radius: 16px; overflow: hidden; border: 3px solid var(--gold); background: #0b1533;
  }
  #pano { position: absolute; inset: 0; }
  .geo-wrap iframe { position: absolute; left: 0; top: -80px; width: 100%; height: calc(100% + 80px); border: 0; }
  .geo-loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fb6e8; }
  .place { font: 900 40px Impact, "Arial Black", sans-serif; color: #b81d27; letter-spacing: 2px; }

  /* ---------- LOCK ---------- */
  .clues { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .clue { padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.08); border: 2px solid #333; font-weight: bold; font-size: 15px; }
  .dials { display: flex; gap: 8px; justify-content: center; margin: 12px 0 4px; }
  .dial { display: flex; flex-direction: column; align-items: center; width: 62px; background: linear-gradient(#ffe27a, #d9a520); border: 3px solid #7a5a00; border-radius: 12px; padding: 3px; }
  .dial button { width: 100%; font-size: 22px; padding: 6px 0; color: #3a2a00; }
  .dial .dv { width: 100%; text-align: center; border-radius: 6px; font: 900 42px "Courier New", monospace; color: #2a1d00; background: #fff8dc; border: 2px solid #7a5a00; }

  /* ---------- INVITE ---------- */
  .invite { text-align: left; }
  .invite .kicker { text-align: center; font-weight: bold; color: #8a5a2a; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
  .invite h3 { text-align: center; font-size: 27px; color: #b81d27; }
  .invite .badges { text-align: center; }
  .invite .row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #d6c79a; }
  .invite .row:last-of-type { border-bottom: 0; }
  .invite .row .ic { font-size: 22px; width: 30px; text-align: center; flex: none; }
  .invite .row small { display: block; color: #6b5a3a; }
  .invite a { color: #1f6fd1; font-weight: bold; }
  .invite .note { text-align: center; font-style: italic; margin-top: 10px; }
  .santa { margin-top: 14px; padding: 14px; border-radius: 10px; text-align: center; background: linear-gradient(135deg, #b81d27, #7a1218); color: #fff; border: 3px solid #4a0a10; }
  .santa h4 { margin: 0 0 6px; font: 900 21px "Comic Sans MS", "Trebuchet MS", sans-serif; }
  .santa .who { font: 900 34px Impact, "Arial Black", sans-serif; color: var(--gold); letter-spacing: 1px; margin: 6px 0; animation: pop .5s cubic-bezier(.3,1.7,.5,1); }
  @keyframes pop { from { transform: scale(.2); } to { transform: scale(1); } }
  .santa .btn { background: linear-gradient(#ffe27a, #d9a520); color: #3a2a00; border-color: #7a5a00; box-shadow: 0 4px 0 #7a5a00; }

  #music {
    position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 280;
    display: none; width: 48px; height: 48px; border-radius: 50%; font-size: 22px;
    background: rgba(20,35,80,.9); border: 2px solid var(--gold); box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  #music.show { display: block; animation: pop .4s; }
  #dev { position: fixed; left: 8px; bottom: 8px; z-index: 400; display: none; flex-direction: column; gap: 4px; padding: 8px; border-radius: 10px; background: rgba(0,0,0,.8); font-size: 12px; }
  #dev button { padding: 5px 8px; border-radius: 6px; background: #334; }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<canvas id="confetti"></canvas>

<main id="hub">
  <h1 id="title"><span>MERRY CHRISTMAS!</span><span class="t2">CRĂCIUN FERICIT!</span></h1>
  <p id="subtitle"></p>
  <button id="present" class="present" aria-label="The lock">
    <div class="lid"><div class="bow"></div></div>
    <div class="box"></div>
    <div class="padlock"><div class="shackle"></div><div class="lock-body" id="lockSlots">? ? ? ?</div></div>
  </button>
  <p id="presentHint"></p>
  <section class="stations">
    <button class="station" data-go="elf"><span class="st-ico">🧝</span><span class="st-name">Counting Elves</span><span class="st-status" id="st-elf"></span></button>
    <button class="station" data-go="jig"><span class="st-ico">🧩</span><span class="st-name">The Snowy Jigsaw</span><span class="st-status" id="st-jig"></span></button>
    <button class="station" data-go="geo"><span class="st-ico">🌍</span><span class="st-name">Where's Santa?</span><span class="st-status" id="st-geo"></span></button>
    <button class="station" data-go="riddle"><span class="st-ico">📜</span><span class="st-name">Santa's Riddle</span><span class="st-status" id="st-riddle"></span></button>
  </section>
  <div id="foot">❄ tap anywhere ❄ · v4</div>
</main>

<section class="panel" id="p-elf"><header class="ph"><button class="back">← Back</button><h2>🧝 Counting Elves</h2><span class="ph-extra" id="elfCount"></span></header><div class="pbody" id="elfBody"></div></section>

<script>
/* =====================================================================

const CONFIG = {
  // The lock code. Digit 1 = Counting Elves, digits 2-4 = Santa's Riddle.

  // Numbers on the presents in the jigsaw picture (a decoy for the lock, a key for the riddle)

  // Where's Santa? — Google Street View
  geo: {

  },

  lockSpecial: {

    "0000": "Really? 🙄"
  }
};
/* ===================================================================== */

/* Secret Santa token — must match the key in santa.html */
const SANTA_KEY = "mos-craciun-2026";
function decodeToken(t) {
  try {
    t = t.replace(/-/g, "+").replace(/_/g, "/");
    while (t.length % 4) t += "=";
    const raw = atob(t);
    const k = new TextEncoder().encode(SANTA_KEY);
    const bytes = Uint8Array.from(raw, (c, i) => c.charCodeAt(0) ^ k[i % k.length]);
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch (e) { return null; }
}
const hashParams = new URLSearchParams(location.hash.slice(1));
const TOKEN = hashParams.get("t") ? decodeToken(hashParams.get("t")) : null;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rand = (a, b) => Math.random() * (b - a) + a;
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[randInt(0, arr.length - 1)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const squash = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const CODE = CONFIG.code;

/* ---------- saved progress ---------- */
const STORE = "craciun2026-v3";
const defaultState = { elf: false, jig: false, geo: false, riddle: false, opened: false, elfFails: 0, nerdy: false, rushed: false, naughty: [], geoTries: 0, riddleTries: 0, santaShown: false };
let S = { ...defaultState };
try {
  if (new URLSearchParams(location.search).has("reset")) localStorage.removeItem(STORE);
  Object.assign(S, JSON.parse(localStorage.getItem(STORE) || "{}"));
} catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }
function addNaughty(name) { if (!S.naughty.includes(name)) S.naughty.push(name); save(); }
const myName = () => (TOKEN && TOKEN.n) || "";

/* ---------- effects ---------- */
function burst(x, y, text = "✨", n = 6) {
  for (let i = 0; i < n; i++) {
    const b = document.createElement("div");
    b.className = "burst"; b.textContent = text;
    b.style.left = x + "px"; b.style.top = y + "px";
    b.style.setProperty("--bx", rand(-70, 70) + "px");
    b.style.setProperty("--by", rand(-70, 70) + "px");
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 750);
  }
}
function floaty(x, y, text, bad = false) {
  const f = document.createElement("div");
  f.className = "floaty" + (bad ? " bad" : ""); f.textContent = text;
  f.style.left = x + "px"; f.style.top = y + "px";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 850);
}
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }

(() => { /* ambient snow */
  const c = $("#snow"), ctx = c.getContext("2d");
  let w, h, flakes = [];
  function resize() { const d = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight; c.width = w * d; c.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  resize(); addEventListener("resize", resize);
  for (let i = 0; i < 90; i++) flakes.push({ x: rand(0, w), y: rand(0, h), r: rand(.8, 2.8), s: rand(.3, 1.1), d: rand(0, 6.28) });
  (function loop() {
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const f of flakes) {
      f.y += f.s; f.d += .01; f.x += Math.sin(f.d) * .4;
      if (f.y > h + 5) { f.y = -5; f.x = rand(0, w); }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.28); ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

const confetti = (() => {
  const c = $("#confetti"), ctx = c.getContext("2d");
  let parts = [], running = false, w, h;
  const colors = ["#ffd84d", "#d8323a", "#2fa84f", "#ffffff", "#6aa9ff", "#ff8ad8"];
  function resize() { const d = Math.min(2, devicePixelRatio || 1); w = innerWidth; h = innerHeight; c.width = w * d; c.height = h * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
  function loop() {
    ctx.clearRect(0, 0, w, h);
    parts = parts.filter(p => p.y < h + 30);
    for (const p of parts) {
      p.vy += .28; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }
    if (parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0, 0, w, h); }
  }
  return (n = 160) => {
    resize();
    for (let i = 0; i < n; i++) parts.push({ x: w / 2 + rand(-w * .25, w * .25), y: h * .4, vx: rand(-8, 8), vy: rand(-15, -5), s: rand(7, 13), c: pick(colors), rot: rand(0, 6), vr: rand(-.3, .3) });
    if (!running) { running = true; requestAnimationFrame(loop); }
  };
})();

/* ---------- music ---------- */
let audio = null;
function playSong(key) {
  const src = CONFIG.songs[key]; if (!src) return;
  try { if (audio) audio.pause(); } catch (e) {}
  audio = new Audio(src);
  audio.volume = .85;
  audio.play().then(() => { $("#music").textContent = "🔊"; $("#music").classList.add("show"); }).catch(() => {});
  audio.addEventListener("ended", () => $("#music").classList.remove("show"));
}
$("#music").addEventListener("click", () => {
  if (!audio) return;
  if (audio.paused) { audio.play(); $("#music").textContent = "🔊"; } else { audio.pause(); $("#music").textContent = "🔇"; }
});

/* ---------- panels + Android back button ---------- */
const renders = {}, stoppers = {};
let current = null;
function openPanel(id, replace = false) {
  if (current) hidePanel(current);
  current = id;
  $("#p-" + id).classList.add("open");
  document.body.classList.add("lock-scroll");
  if (replace) history.replaceState({ p: id }, "", location.href); else history.pushState({ p: id }, "", location.href);
  renders[id] && renders[id]();
}
function hidePanel(id) { $("#p-" + id).classList.remove("open"); stoppers[id] && stoppers[id](); }
function closePanel() {
  if (!current) return;
  hidePanel(current); current = null;
  document.body.classList.remove("lock-scroll");
  renderHub();
}
addEventListener("popstate", () => closePanel());
$$(".back").forEach(b => b.addEventListener("click", () => history.back()));
addEventListener("keydown", e => { if (e.key === "Escape" && current) history.back(); });

/* ---------- HUB ---------- */
const digitsKnown = () => [S.elf ? CODE[0] : "?", ...(S.riddle ? CODE.slice(1).split("") : ["?", "?", "?"])];
function renderHub() {
  const name = myName() ? `Hi ${esc(myName())}! ` : "";
  $("#subtitle").innerHTML = S.opened ? `🎉 ${name}You opened the present!` : `🎁 ${name}Your present is locked. Find the code.`;
  $("#lockSlots").textContent = digitsKnown().join(" ");
  $("#present").classList.toggle("open", S.opened);
  $("#presentHint").textContent = S.opened ? "Tap the present to see the invitation" : "Tap the present to enter the code";
  const set = (id, done, txt, locked = false) => {
    const el = $("#st-" + id); el.textContent = txt;
    el.parentElement.classList.toggle("done", done);
    el.parentElement.classList.toggle("locked", locked);
  };
  set("elf", S.elf, S.elf ? `✅ digit ❶: ${CODE[0]}${S.nerdy ? " 🤓" : ""}` : (S.elfFails ? "📜 on the Naughty List" : "quick maths"));
  set("jig", S.jig, S.jig ? `✅ ${CONFIG.jigsawNumbers.join("")}` : "catch & build");
  set("geo", S.geo, S.geo ? `✅ 📍 ${CONFIG.geo.display}` : "look around");
  const ready = S.jig && S.geo;
  set("riddle", S.riddle, S.riddle ? `✅ digits ❷❸❹: ${CODE.slice(1)}` : (ready ? "ready to solve" : "🔒 needs 🧩 + 🌍"), !ready && !S.riddle);
}
$$(".station").forEach(b => b.addEventListener("click", () => openPanel(b.dataset.go)));
$("#present").addEventListener("click", () => openPanel(S.opened ? "invite" : "lock"));
$("#hub").addEventListener("pointerdown", e => { if (!e.target.closest("button")) burst(e.clientX, e.clientY, pick(["❄", "✨", "★"]), 6); });

/* =====================================================================
   🧝 COUNTING ELVES
   ===================================================================== */
const ELF_SVG = `<svg viewBox="0 0 100 110" aria-hidden="true">
  <path d="M22 60 L2 44 L26 52 Z" fill="#f6cfa8" stroke="#7a4a2a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M78 60 L98 44 L74 52 Z" fill="#f6cfa8" stroke="#7a4a2a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M24 92 Q50 82 76 92 L84 112 L16 112 Z" fill="#c0392b" stroke="#6e1a12" stroke-width="3"/>
  <path d="M44 88 L50 98 L56 88" fill="#ffd84d" stroke="#7a5a00" stroke-width="2"/>
  <ellipse cx="50" cy="62" rx="28" ry="27" fill="#f6cfa8" stroke="#7a4a2a" stroke-width="3"/>
  <path d="M22 46 Q46 -6 88 8 Q72 22 78 46 Z" fill="#2fa84f" stroke="#145c2a" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="88" cy="9" r="7" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <rect x="18" y="40" width="64" height="11" rx="5.5" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <circle cx="40" cy="62" r="4.2" fill="#111"/><circle cx="60" cy="62" r="4.2" fill="#111"/>
  <circle cx="41.5" cy="60.5" r="1.3" fill="#fff"/><circle cx="61.5" cy="60.5" r="1.3" fill="#fff"/>
  <circle cx="31" cy="72" r="5" fill="#ff8a8a" opacity=".55"/><circle cx="69" cy="72" r="5" fill="#ff8a8a" opacity=".55"/>
  <path d="M41 75 Q50 85 59 75" stroke="#5a2a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`;

let E = null;
function naughtyHTML(extraYou) {
  const names = [...CONFIG.naughtySeed, ...S.naughty];
  return `<div class="naughty"><b>📜 The Naughty List</b><ol>
    ${names.map(n => `<li>${esc(n)}</li>`).join("")}
    ${extraYou ? `<li class="you">${esc(extraYou)} 👈 you</li>` : ""}
  </ol></div>`;
}
renders.elf = () => {
  $("#elfCount").textContent = "";
  if (S.elf) {
    $("#elfBody").innerHTML = `<div class="card"><h3>Done! 🎉</h3>
      ${S.nerdy ? `<div class="title-badge">🤓 The Nerdy Elf</div>` : ""}
      <p>First digit of the code:</p><div class="big-digit">${CODE[0]}</div>
      ${S.elfFails ? naughtyHTML() : ""}
      <p><button class="btn ghost" id="elfReplay">Play again, just for fun</button></p></div>`;
    $("#elfReplay").onclick = () => elfIntro(true);
    return;
  }
  elfIntro(false);
};
function elfIntro(forFun) {
  const second = S.elfFails > 0 && !forFun;
  $("#elfBody").innerHTML = `<div class="card">
    <h3>${second ? "The Rematch 😤" : "Counting Elves"}</h3>
    <p>You start from a number. Every elf that pops up holds an <b>operation</b> (+2, ×3, ÷2...).</p>
    <p>${CONFIG.elf.onlyHitsCount ? "<b>Only the elves you whack count!</b> Ignore the ones you miss." : "<b>Every elf counts</b>, even if you don't whack it."}</p>
    <p>Keep count in your head. At the end I'll ask for the result. 🧠</p>
    ${!second && !forFun ? `<p><small>Get it right first time and earn a special title… 🤓</small></p>` : ""}
    ${second ? naughtyHTML() : ""}
    <button class="btn green" id="elfGo">Start!</button></div>`;
  $("#elfGo").onclick = () => elfBegin(second, forFun);
}
function elfBegin(second, forFun) {
  stoppers.elf();
  const total = randInt(CONFIG.elf.minElves, CONFIG.elf.maxElves), start = randInt(2, 9);
  E = { value: start, total, left: total, second, forFun, active: null, timers: [], lastHole: -1 };
  $("#elfBody").innerHTML = `
    <div class="elf-top"><div class="elf-start">You start from <b>${start}</b></div>
    <div class="elf-note">${CONFIG.elf.onlyHitsCount ? "whack them to make them count!" : "they all count!"}</div></div>
    <div class="holes">${Array.from({ length: 6 }, (_, i) => `<div class="hole"><div class="elf" data-i="${i}"><div class="esign"></div>${ELF_SVG}</div></div>`).join("")}</div>`;
  $$("#elfBody .elf").forEach(el => el.addEventListener("pointerdown", ev => { ev.preventDefault(); elfHit(+el.dataset.i, ev); }));
  elfCountUI();
  E.timers.push(setTimeout(elfNext, 1500));
}
function elfCountUI() { $("#elfCount").textContent = E ? `🧝 ${E.left}` : ""; }
function pickOp(v) {
  const c = [], add = (label, fn, w = 1) => c.push({ label, fn, w });
  add("+1", x => x + 1, .8); add("+2", x => x + 2); add("+3", x => x + 3); add("+5", x => x + 5, .6);
  if (v >= 2) add("−1", x => x - 1, .7);
  if (v >= 3) add("−2", x => x - 2);
  if (v >= 5) add("−3", x => x - 3);
  if (v >= 2 && v % 2 === 0) add("÷2", x => x / 2, 1.7);
  if (v >= 3 && v % 3 === 0 && v <= 30) add("÷3", x => x / 3, .9);
  if (v <= 20) add("×2", x => x * 2, 1.3);
  if (v <= 10) add("×3", x => x * 3, .8);
  if (v <= 6) add("×4", x => x * 4, .6);
  let r = Math.random() * c.reduce((s, o) => s + o.w, 0);
  for (const o of c) if ((r -= o.w) <= 0) return o;
  return c[0];
}
function elfNext() {
  if (!E) return;
  if (E.left <= 0) { E.timers.push(setTimeout(elfEnd, 650)); return; }
  let i; do { i = randInt(0, 5); } while (i === E.lastHole);
  E.lastHole = i;
  const op = pickOp(E.value), el = $$("#elfBody .elf")[i];
  el.className = "elf"; $(".esign", el).textContent = op.label; void el.offsetWidth; el.classList.add("up");
  E.active = { i, op, done: false };
  E.active.timer = setTimeout(elfMiss, CONFIG.elf.visibleMs * (E.second ? .92 : 1));
  E.timers.push(E.active.timer);
}
function elfResolve(hit) {
  const a = E.active; a.done = true; clearTimeout(a.timer);
  E.left--; elfCountUI();
  const el = $$("#elfBody .elf")[a.i];
  if (hit || !CONFIG.elf.onlyHitsCount) E.value = a.op.fn(E.value);
  el.classList.add(hit ? "hit" : "miss");
  if (!hit) $(".esign", el).textContent = pick(CONFIG.elf.missTaunts);
  E.timers.push(setTimeout(() => { el.classList.remove("up"); E.timers.push(setTimeout(elfNext, rand(250, 700))); }, hit ? 330 : 520));
}
function elfHit(i, ev) {
  if (!E || !E.active || E.active.done || E.active.i !== i) return;
  burst(ev.clientX, ev.clientY, "💥", 5);
  elfResolve(true);
}
function elfMiss() { if (E && E.active && !E.active.done) elfResolve(false); }
function elfEnd() {
  const answer = E.value, second = E.second, forFun = E.forFun;
  $("#elfCount").textContent = "";
  if (second) {
    $("#elfBody").innerHTML = `<div class="card"><h3>You know what?</h3>
      <p>The result doesn't matter anymore. 🙃<br>Just tell me <b>your name</b>.</p>
      <input class="big" id="elfName" maxlength="30" placeholder="Your name" autocomplete="off">
      <div class="msg" id="elfMsg"></div><button class="btn green" id="elfOk">Done</button></div>`;
    const inp = $("#elfName");
    const go = () => {
      const n = inp.value.trim();
      if (!n) { $("#elfMsg").textContent = "Come on, don't be shy."; shake(inp); return; }
      const knew = myName() && squash(n) === squash(myName());
      addNaughty(n); S.elf = true; save(); E = null;
      $("#elfBody").innerHTML = `<div class="card"><h3>${knew ? "I know. I was just testing you. 😏" : `Thank you, ${esc(n)}. 📝`}</h3>
        <p>You are now officially on the Naughty List.</p>${naughtyHTML()}
        <p>But it's Christmas, so here's the digit:</p><div class="big-digit">${CODE[0]}</div>
        <p><button class="btn" id="elfHome">Back to the present</button></p></div>`;
      $("#elfHome").onclick = () => history.back();
      confetti(90);
    };
    $("#elfOk").onclick = go;
    inp.addEventListener("keydown", e => e.key === "Enter" && go());
    setTimeout(() => inp.focus(), 50);
    return;
  }
  $("#elfBody").innerHTML = `<div class="card"><h3>What number did you end up with? 🤔</h3>
    <input class="big" id="elfAns" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="?">
    <div class="msg" id="elfMsg"></div><button class="btn green" id="elfOk">Check</button></div>`;
  const inp = $("#elfAns");
  const go = () => {
    if (inp.value.trim() === "") { shake(inp); return; }
    const ok = parseInt(inp.value, 10) === answer;
    E = null;
    if (ok) {
      if (!forFun) { S.elf = true; S.nerdy = true; save(); }
      confetti();
      $("#elfBody").innerHTML = `<div class="card"><h3>CORRECT! 🎉</h3><p>The answer was <b>${answer}</b>.</p>
        ${forFun ? "" : `<p>First try! You are officially:</p><div class="title-badge">🤓 The Nerdy Elf</div>`}
        <p>First digit of the code:</p><div class="big-digit">${CODE[0]}</div>
        <p><button class="btn" id="elfHome">Back to the present</button></p></div>`;
      $("#elfHome").onclick = () => history.back();
    } else if (forFun) {
      $("#elfBody").innerHTML = `<div class="card"><h3>Wrong 😅</h3><p>It was <b>${answer}</b>. Lucky you already have the digit.</p><button class="btn ghost" id="elfRe">Again</button></div>`;
      $("#elfRe").onclick = () => elfIntro(true);
    } else {
      S.elfFails++; save();
      $("#elfBody").innerHTML = `<div class="card shake"><h3>WRONG! ❌</h3>
        <p>The right answer was <b>${answer}</b>.</p><p>Santa has put you on <b>the Naughty List</b>.</p>
        ${naughtyHTML("???")}<button class="btn" id="elfRe">Let me try again 😤</button></div>`;
      $("#elfRe").onclick = () => elfIntro(false);

function jigStart() {
  J = { got: [], timer: setInterval(jigSpawn, CONFIG.jigsaw.spawnMs) };

function jigSpawn() {
  const area = $("#jigArea"); if (!area || !J) return;
  const r = Math.random();
  const type = r < CONFIG.jigsaw.pieceChance ? "piece" : r < CONFIG.jigsaw.pieceChance + CONFIG.jigsaw.fireChance ? "fire" : "norm";
  const el = document.createElement("button");
  el.className = "flake " + type;
  el.textContent = type === "fire" ? "🔥" : type === "piece" ? "🧩" : "❄";
  el.style.left = rand(8, 92) + "%";
  el.style.animationDuration = (type === "piece" ? rand(3.6, 5) : rand(4, 6.5)) + "s";
  el.style.setProperty("--sway", rand(-50, 50) + "px");
  el.style.setProperty("--fall", area.clientHeight + 80 + "px");
  el.addEventListener("pointerdown", e => { e.preventDefault(); jigCatch(el, type, e); }, { once: true });
  el.addEventListener("animationend", () => el.remove());
  area.appendChild(el);
}
function jigCatch(el, type, e) {
  if (!J) return;
  el.remove();
  if (type === "norm") { burst(e.clientX, e.clientY, "❄", 3); return; }
  if (type === "fire") {
    if (J.got.length) { J.got.pop(); floaty(e.clientX, e.clientY, "−🧩", true); } else floaty(e.clientX, e.clientY, "🔥", true);
    shake($("#jigArea"));
  } else {
    const missing = [...Array(9).keys()].filter(i => !J.got.includes(i));
    J.got.push(pick(missing));
    floaty(e.clientX, e.clientY, "+🧩");
    burst(e.clientX, e.clientY, "✨", 5);
  }
  jigUI();
  if (J.got.length >= 9) {
    stoppers.jig();
    JB = { got: true, placed: [], order: [...Array(9).keys()].sort(() => Math.random() - .5) };
    confetti(80);
    setTimeout(jigBuild, 500);
  }
}
function jigBuild() {
  $("#jigBody").innerHTML = `<p class="lead">All 9 pieces! Now put Santa's picture back together.<br><small>Drag a piece into the frame — or tap a piece, then tap its spot.</small></p>
    <div class="jframe" id="jframe">

  });

  }));
}
function jigFill(id) {
  const c = $(`#jframe .jcell[data-cell="${id}"]`);
  c.setAttribute("style", c.getAttribute("style") + ";" + pieceBG(id));
  c.classList.add("filled");
}
function jigTry(id, cell) {
  const p = $(`#jtray .jp[data-id="${id}"]`);
  if (id !== cell) {
    const c = $(`#jframe .jcell[data-cell="${cell}"]`);
    if (c && !c.classList.contains("filled")) { c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 300); }
    if (p) shake(p);
    return;
  }
  JB.placed.push(id); jigFill(id); if (p) p.remove();
  if (JB.placed.length === 9) {
    S.jig = true; save();
    setTimeout(() => { $("#jframe").classList.add("solved"); confetti(); setTimeout(() => jigDone(true), 1200); }, 200);
  }
}
function jigDragify(p) {
  let sx, sy, ghost = null;
  p.addEventListener("pointerdown", e => {
    e.preventDefault(); sx = e.clientX; sy = e.clientY;
    p.setPointerCapture(e.pointerId);
  });
  p.addEventListener("pointermove", e => {
    if (sx === undefined) return;
    if (!ghost && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) {
      ghost = p.cloneNode(); ghost.classList.add("ghost"); ghost.classList.remove("sel");
      ghost.style.width = p.offsetWidth + "px"; document.body.appendChild(ghost); p.classList.add("dragging");
    }
    if (ghost) { ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px"; }
  });
  const end = e => {
    if (sx === undefined) return;
    if (ghost) {
      ghost.remove(); ghost = null; p.classList.remove("dragging");
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const cell = under && under.closest(".jcell");
      if (cell) jigTry(+p.dataset.id, +cell.dataset.cell);
    } else {
      const was = p.classList.contains("sel");
      $$("#jtray .jp").forEach(x => x.classList.remove("sel"));
      if (!was) p.classList.add("sel");
    }
    sx = undefined;
  };
  p.addEventListener("pointerup", end);
  p.addEventListener("pointercancel", () => { if (ghost) { ghost.remove(); ghost = null; p.classList.remove("dragging"); } sx = undefined; });
}

function geoMount() {

    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CONFIG.geo.apiKey)}&callback=__geoReady&loading=async`;
    s.async = true;
    s.onerror = geoFallback;
    document.head.appendChild(s);

}
function geoPano() {
  const G = CONFIG.geo, el = $("#pano"); if (!el) return;

  new google.maps.StreetViewPanorama(el, {
    pano: G.pano,
    pov: { heading: G.heading, pitch: G.pitch },
    zoom: 0,
    disableDefaultUI: true,
    zoomControl: true,
    addressControl: false,
    linksControl: false,
    clickToGo: false,

    panControl: false,

    ${b.length ? `<div class="badges">${b.map(x => `<span class="title-badge" style="font-size:15px">${x}</span>`).join(" ")}<br><a class="btn ghost" href="${brag}" target="_blank" rel="noopener" style="font-size:14px">Brag in the group chat 📣</a></div>` : ""}
    ${row("📅", esc(P.date), esc(P.time))}
    ${row("📍", place, esc(P.address))}
    ${row("👕", esc(P.dress))}
    ${row("🎒", esc(P.bring))}
    ${row("✉️", esc(P.rsvp))}
    <p class="note">${esc(P.note)}</p>
    <div class="santa" id="santaBox">${santa}</div></div>`;
  const go = $("#santaGo");
  if (go) go.onclick = () => { S.santaShown = true; save(); $("#santaBox").innerHTML = santaReveal(); confetti(200); };
  if (!renders.invite.played) { renders.invite.played = true; confetti(220); }
};
function santaReveal() {
  return `<h4>🎅 You're buying a present for:</h4><div class="who">${esc(TOKEN.r)}</div>
    ${TOKEN.b ? `<p>💸 Budget: <b>${esc(TOKEN.b)}</b></p>` : ""}${TOKEN.m ? `<p>${esc(TOKEN.m)}</p>` : ""}
    <p style="font-size:13px;opacity:.85">🤫 Don't tell anyone!</p>`;
}

/* ---------- dev mode: add ?dev to the URL ---------- */
if (new URLSearchParams(location.search).has("dev")) {
  const d = $("#dev"); d.style.display = "flex";
  const btn = (t, f) => { const b = document.createElement("button"); b.textContent = t; b.onclick = () => { f(); save(); renderHub(); }; d.appendChild(b); };
  btn("✓ elves (nerdy)", () => { S.elf = true; S.nerdy = true; });
  btn("✓ jigsaw", () => S.jig = true);
  btn("✓ geo", () => S.geo = true);
  btn("✓ riddle", () => S.riddle = true);
  btn("♪ song 1", () => playSong("riddle"));
  btn("♪ song 2", () => playSong("lock"));
  btn("↺ reset", () => { S = { ...defaultState, naughty: [] }; JB = null; });
}

renderHub();
</script>
</body>
